bio: |
  Michael W. B. Watterworth is a PhD candidate in Health Sciences at Ontario
  Tech University, specializing in biomechanics and ergonomics. His research
  focuses on occupational biomechanics, overhead work, upper-limb exoskeletons,
  effort-duration measurement, and the development of practical tools for
  assessing and preventing work-related musculoskeletal disorders. His work
  combines laboratory research, statistical modelling, and applied ergonomics
  within automotive manufacturing.

